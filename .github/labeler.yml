area:api:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/**"

area:web:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/web/**"

area:admin:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/admin/**"

area:contracts:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/**"

area:db:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/database/**"
          - "apps/api/src/modules/**/schemas/**"

area:payments:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/integrations/stripe/**"
          - "apps/api/src/modules/bookings/**"

area:security:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/auth/**"
          - "apps/api/src/common/security/**"
          - "apps/api/src/common/guards/**"
          - "apps/api/src/common/auth-cookie.ts"
          - "apps/api/src/config/**"

area:observability:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/common/logging/**"

area:testing:
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/test/**"
          - "**/*.test.ts"
          - "**/*.test.tsx"
          - "**/*.spec.ts"

area:infra:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "scripts/**"
          - "Dockerfile"
          - "docker-compose*.yml"
          - "apps/api/Dockerfile"
          - "**/vercel.json"

type:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "pnpm-lock.yaml"
          - "package.json"
          - "**/package.json"
