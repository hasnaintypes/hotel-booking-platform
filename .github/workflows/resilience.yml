name: M2 resilience gate

# The concurrency, replay and fault-injection suite (#57). It runs on every change to the booking
# and payment paths, and nightly so a race that only appears under scheduling pressure is still
# noticed when nobody is pushing. The suite is a subset of `pnpm test`, kept separate because it is
# the milestone's acceptance gate and must stay fast and named.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/modules/bookings/**"
      - "apps/api/src/modules/payments/**"
      - "apps/api/src/modules/webhooks/**"
      - "apps/api/src/modules/reconciliation/**"
      - "apps/api/src/modules/inventory/**"
      - "apps/api/src/database/repositories/**"
      - "apps/api/src/domain/**"
      - "apps/api/test/m2-acceptance.e2e-spec.ts"
      - "apps/api/test/support/**"
      - "packages/db/**"
      - "packages/pricing/**"
      - ".github/workflows/resilience.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/src/modules/bookings/**"
      - "apps/api/src/modules/payments/**"
      - "apps/api/src/modules/webhooks/**"
      - "apps/api/src/modules/reconciliation/**"
      - "apps/api/src/modules/inventory/**"
      - "apps/api/src/database/repositories/**"
      - "apps/api/src/domain/**"
      - "apps/api/test/m2-acceptance.e2e-spec.ts"
      - "apps/api/test/support/**"
      - "packages/db/**"
      - "packages/pricing/**"
      - ".github/workflows/resilience.yml"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resilience-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_booking_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_booking_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @hotel-booking/api test:resilience
