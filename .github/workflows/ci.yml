name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_booking_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_booking_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:license
      - run: pnpm check:unused
      - run: pnpm format:check
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  # Playwright end to end: the real API, the production web build and a local Stripe mock (no Stripe
  # account or network access). The suite resets, migrates and seeds its own disposable
  # `hotel_booking_e2e` database, so it never touches the `hotel_booking_test` database above.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_booking_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_booking_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_booking_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @hotel-booking/web exec playwright install --with-deps chromium

      - name: Run the Playwright suite
        run: pnpm --filter @hotel-booking/web test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Builds the production image and checks what the unit and integration tests cannot: that it
  # does not run as root, starts with a read-only filesystem, passes its health check and does
  # not serve the API documentation.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t hotel-booking-api:ci .

      - name: Runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id hotel-booking-api:ci -u)"
          echo "container user id: $uid"
          test "$uid" != "0"

      - name: Starts read-only, passes the health check and serves no API docs
        run: |
          docker run -d --name api --network host --read-only --tmpfs /tmp \
            -e PORT=5001 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/hotel_booking_test \
            -e JWT_SECRET_KEY=ci-only-secret-used-nowhere-else \
            -e CLOUDINARY_CLOUD_NAME=ci -e CLOUDINARY_API_KEY=ci -e CLOUDINARY_API_SECRET=ci \
            -e STRIPE_API_KEY=sk_test_ci \
            -e STRIPE_WEBHOOK_SECRET=whsec_test_ci \
            hotel-booking-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:5001/health/live > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:5001/health/live
          docs="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/api-docs/)"
          echo "GET /api-docs/ -> $docs"
          test "$docs" = "404"

      - name: Show the container log
        if: failure()
        run: docker logs api || true
