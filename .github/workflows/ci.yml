name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # API integration tests use this server; locally an in-memory MongoDB is used instead.
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:license
      - run: pnpm format:check
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  # Builds the production image and checks what the unit and integration tests cannot: that it
  # does not run as root, starts with a read-only filesystem, passes its health check and does
  # not serve the API documentation.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t hotel-booking-api:ci .

      - name: Runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id hotel-booking-api:ci -u)"
          echo "container user id: $uid"
          test "$uid" != "0"

      - name: Starts read-only, passes the health check and serves no API docs
        run: |
          docker run -d --name api --network host --read-only --tmpfs /tmp \
            -e PORT=5001 \
            -e MONGODB_CONNECTION_STRING=mongodb://localhost:27017/container_smoke \
            -e JWT_SECRET_KEY=ci-only-secret-used-nowhere-else \
            -e CLOUDINARY_CLOUD_NAME=ci -e CLOUDINARY_API_KEY=ci -e CLOUDINARY_API_SECRET=ci \
            -e STRIPE_API_KEY=sk_test_ci \
            hotel-booking-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:5001/api/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:5001/api/health
          docs="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5001/api-docs/)"
          echo "GET /api-docs/ -> $docs"
          test "$docs" = "404"

      - name: Show the container log
        if: failure()
        run: docker logs api || true
