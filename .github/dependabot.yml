version: 2

updates:
  # pnpm workspace (root lockfile covers apps/* and packages/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # NestJS 12 is ESM-only and TypeScript 7 is not yet supported by typescript-eslint.
    # Majors stay on hold until the toolchain decision (issue M3-10).
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # API image; Node is pinned to 22 (.nvmrc, CI), so skip major bumps
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
